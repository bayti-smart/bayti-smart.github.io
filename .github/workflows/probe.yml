name: probe-courses
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          mkdir -p scripts
          {
            echo "=== list page"
            curl -s -m 40 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://api.coursera.org/api/courses.v1?limit=3&start=0&fields=name,slug,photoUrl,description,primaryLanguages,workload,courseType,partnerIds,domainTypes,startDate,certificates" | cut -c1-2600
            echo "=== total"
            curl -s -m 40 "https://api.coursera.org/api/courses.v1?limit=1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('paging'))"
            echo "=== partners"
            curl -s -m 40 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://api.coursera.org/api/partners.v1?limit=2&fields=name,shortName,logo" | cut -c1-800
            echo "=== specializations"
            curl -s -m 40 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://api.coursera.org/api/onDemandSpecializations.v1?limit=2&fields=name,slug,logo,description,courseIds,partnerIds,tagline" | cut -c1-1500
          } > scripts/probe_courses.txt 2>&1
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/probe_courses.txt
          git commit -m "probe courses api [skip ci]" || exit 0
          git pull -q --rebase origin main && git push
