name: probe-sitemap
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY' > scripts/probe_sitemap.txt 2>&1
          import urllib.request, urllib.error, re, xml.dom.minidom as md, random
          B="https://bayti-smart.github.io"
          def get(u, ua="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":ua}),timeout=30)
                  return r.status, r.headers.get("Content-Type"), r.read(), r.geturl()
              except urllib.error.HTTPError as e: return e.code, None, b"", u
              except Exception as e: return 0, repr(e), b"", u
          for p in ["/robots.txt","/sitemap.xml"]:
              s,ct,b,fu=get(B+p); print(p,s,ct,len(b),"final:",fu)
              if p=="/robots.txt": print(b.decode("utf-8","replace")[:600])
          s,ct,b,_=get(B+"/sitemap.xml")
          txt=b.decode("utf-8","replace")
          print(txt[:700])
          try: md.parseString(b); print("XML well-formed: yes")
          except Exception as e: print("XML ERROR",e)
          locs=re.findall(r"<loc>([^<]+)</loc>",txt)
          print("locs in sitemap.xml:",len(locs))
          allurls=[]
          for l in locs:
              s,ct,bb,_=get(l); n=len(re.findall(r"<loc>",bb.decode("utf-8","replace")))
              try: md.parseString(bb); ok="ok"
              except Exception as e: ok="XMLERR "+str(e)[:60]
              print(" child",l,s,ct,len(bb),"urls",n,ok)
              if n: allurls+= re.findall(r"<loc>([^<]+)</loc>",bb.decode("utf-8","replace"))
          if not locs:
              allurls=locs
          random.seed(1); sample=random.sample(allurls,min(25,len(allurls))) if allurls else []
          bad=0
          for u in sample:
              s,_,_,fu=get(u)
              if s!=200 or fu!=u: bad+=1; print("  BAD",u,s,fu)
          print("sampled",len(sample),"bad",bad)
          PY
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/probe_sitemap.txt
          git commit -m "probe sitemap [skip ci]" || exit 0
          git pull -q --rebase origin main && git push
