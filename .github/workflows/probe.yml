name: probe-live
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
            echo "=== root headers (no follow)"
            curl -s -m 30 -I -A "Mozilla/5.0" https://bayti-smart.github.io/ | head -15
            echo "=== root body: impact tag lines"
            curl -s -m 30 -A "Mozilla/5.0" https://bayti-smart.github.io/ | grep -n -i "impact-site-verification" || echo "NOT FOUND in root body"
            echo "=== root body head (first 25 lines)"
            curl -s -m 30 -A "Mozilla/5.0" https://bayti-smart.github.io/ | head -25 | cut -c1-200
            echo "=== /en/ tag"
            curl -s -m 30 -L -A "Mozilla/5.0" https://bayti-smart.github.io/en/ | grep -n -i "impact-site-verification" || echo "NOT FOUND in /en/"
            echo "=== all pages count with tag (sample 3)"
            for u in ar/ fr/ courses/; do curl -s -m 30 -L -A "Mozilla/5.0" https://bayti-smart.github.io/$u | grep -c -i "impact-site-verification"; done
          } > scripts/probe_live.txt 2>&1
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/probe_live.txt
          git commit -m "probe live [skip ci]" || exit 0
          git pull -q --rebase origin main && git push
