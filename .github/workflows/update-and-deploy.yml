name: تحديث المنتجات ونشر الموقع

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      auto_add:
        description: "إضافة منتجات جديدة تلقائيًا"
        type: boolean
        default: true
      dry_run:
        description: "تجربة فقط: اكتب التقرير بلا تعديل المنتجات"
        type: boolean
        default: false
      audit:
        description: "تدقيق المنتجات الحالية (apply = يطبّق التعديلات، report = تقرير فقط، off = إيقاف)"
        type: choice
        options: [apply, report, "off"]
        default: apply
      count:
        description: "عدد المنتجات (اتركه فارغًا للعشوائي بين 5 و20)"
        type: string
        default: ""
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: فحص/مزامنة AliExpress (لا يوقف النشر عند الفشل)
        run: python scripts/ae_sync.py
        continue-on-error: true
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}

      - name: تدقيق المنتجات الحالية (صور، توفّر، سعر، تكرار)
        if: github.event_name != 'push' && github.event.inputs.audit != 'off'
        run: python scripts/audit_products.py
        continue-on-error: true
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AUDIT_MODE: ${{ github.event.inputs.audit || 'apply' }}

      - name: إضافة منتجات جديدة تلقائيًا (5 إلى 20 يوميًا)
        if: github.event_name != 'push' && github.event.inputs.auto_add != 'false'
        run: python scripts/auto_add_products.py
        continue-on-error: true
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AUTO_COUNT: ${{ github.event.inputs.count }}
          AUTO_DRY_RUN: ${{ github.event.inputs.dry_run }}

      - name: تحديث قسم الدورات (اكتشاف تلقائي من كتالوج Coursera)
        if: github.event_name != 'push'
        run: python scripts/courses_sync.py
        continue-on-error: true

      - name: تخزين صور المنتجات محليًا (أسرع وأوثق)
        run: |
          pip install pillow
          python scripts/cache_images.py
        continue-on-error: true

      - name: تحديث products.json من sources.csv
        run: python scripts/fetch_products.py

      - name: حفظ التغييرات في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A products.json scripts site/assets/img/p site/assets/img/c
          git diff --cached --quiet && exit 0
          git commit -m "تحديث تلقائي للمنتجات"
          for i in 1 2 3; do
            if git pull -q --rebase origin main || { python scripts/fetch_products.py && git add products.json && GIT_EDITOR=true git rebase --continue; }; then
              git push && exit 0
            fi
            sleep 5
          done
          exit 1
        continue-on-error: true

  deploy-pages:
    needs: update-products
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت أدوات البناء
        run: pip install jinja2 beautifulsoup4

      - name: توليد products.json من المصادر
        run: python scripts/fetch_products.py

      - name: بناء الموقع الثابت (5 لغات)
        run: python scripts/build_site.py --out dist

      - name: فحص الموقع (روابط، وسوم SEO، خريطة الموقع)
        run: python scripts/check_site.py dist

      - name: تجهيز Pages
        uses: actions/configure-pages@v5

      - name: رفع الملفات
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: نشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: اختبار الموقع المنشور
        run: |
          B=https://bayti-smart.github.io
          fail=0
          check() {
            for i in 1 2 3 4; do
              code=$(curl -s -L -o /tmp/o -w "%{http_code}" "$B$1")
              if [ "$code" = "200" ] && grep -q "$2" /tmp/o; then echo "::notice::OK $1"; return 0; fi
              sleep 15
            done
            echo "::error::FAIL $1 (HTTP $code)"; fail=1
          }
          check "/" "Build a smarter home"
          check "/ar/" 'dir="rtl"'
          check "/fr/" 'lang="fr"'
          check "/p/zigbee-smoke-detector-fire-alarm/" "Zigbee Smart Smoke Detector"
          check "/c/pets/" "Pets"
          check "/guides/zigbee/" "Zigbee or Wi-Fi"
          check "/products/" "All products"
          check "/guides.html" "location.replace"
          check "/sitemap.xml" "sitemapindex"
          check "/sitemap-en.xml" "hreflang"
          check "/sitemap-ar.xml" "hreflang"
          check "/robots.txt" "Sitemap:"
          check "/products.json" "products"
          exit $fail
